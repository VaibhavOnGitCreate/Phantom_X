<!DOCTYPE html>
<html>
<head>

<title>AI Insights</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(180deg,#020508,#050b12,#020508);
color:white;
}

.container{
width:1000px;
margin:auto;
padding:20px;
}

.title{
color:#00d4ff;
font-size:28px;
margin-bottom:20px;
}

.box{
display:flex;
align-items:center;
background:rgba(255,255,255,0.03);
border:1px solid rgba(0,212,255,0.2);
border-radius:10px;
padding:15px;
margin-bottom:15px;
}

.circle{
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
margin-right:15px;
background:conic-gradient(#00d4ff 70%, #111 0%);
}

.text{
white-space:pre-line;
color:#8b949e;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
AI Insights
</div>

<div id="container">
Loading insights...
</div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function(){

const emojis=["⏱","⚠","🎯","🧠","🛡","🔥"]

const insights = {{ insights | tojson | safe }}

const container=document.getElementById("container")

container.innerHTML=""

for(let i=0;i<6;i++){

const box=document.createElement("div")

box.className="box"

box.innerHTML=`

<div class="circle">
${emojis[i]}
</div>

<div class="text">
${insights[i]}
</div>

`

container.appendChild(box)

}

})

</script>


</body>
</html>

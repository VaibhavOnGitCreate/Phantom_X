<!DOCTYPE html>
<html>
<head>

<title>Phantom_X AI Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

body{
margin:0;
font-family:Inter,Segoe UI,sans-serif;
background:linear-gradient(180deg,#020508,#050b12,#020508);
color:white;
}

.container{
width:1200px;
margin:auto;
padding:30px;
}

.title{
color:#00d4ff;
font-size:32px;
margin-bottom:20px;
}

.context{
margin-bottom:20px;
padding:15px;
background:rgba(0,212,255,0.05);
border-radius:8px;
color:#8b949e;
line-height:1.6;
}

/* CHAT BOX */

.chat-box{

height:500px;

overflow-y:auto;

padding:20px;

background:rgba(255,255,255,0.03);

border-radius:10px;

border:1px solid rgba(0,212,255,0.2);

margin-bottom:15px;

}

/* MESSAGE STYLES */

.msg{
margin-bottom:20px;
line-height:1.7;
}

.user{
color:#00d4ff;
font-weight:500;
}

.ai{
color:#e6edf3;
background:rgba(0,212,255,0.05);
padding:15px;
border-radius:8px;
}

/* INPUT */

.input-row{
display:flex;
gap:10px;
}

input{

flex:1;

padding:15px;

background:#020508;

border:1px solid rgba(0,212,255,0.3);

color:white;

border-radius:6px;

font-size:15px;

}

button{

padding:15px 25px;

background:linear-gradient(90deg,#00d4ff,#7a5cff);

border:none;

color:white;

border-radius:6px;

cursor:pointer;

font-weight:500;

}

button:hover{
opacity:0.9;
}

/* MARKDOWN FIXES */

.ai p{
margin:8px 0;
}

.ai code{
background:#111;
padding:4px 6px;
border-radius:4px;
}

.ai pre{
background:#111;
padding:10px;
border-radius:6px;
overflow-x:auto;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
Phantom_X AI Assistant
</div>

<div class="context">

<b>Captured Text Context:</b><br><br>

{{ extracted_text }}

</div>

<div id="chat" class="chat-box"></div>

<div class="input-row">

<input id="input" placeholder="Ask Phantom_X anything...">

<button onclick="send()">Send</button>

</div>

</div>


<script>

async function send(){

const input=document.getElementById("input")
const chat=document.getElementById("chat")

const text=input.value.trim()

if(!text)return

chat.innerHTML+=`
<div class="msg user">
You: ${text}
</div>
`

input.value=""

const res=await fetch("/assistant",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text
})

})

const data=await res.json()

/* PARSE MARKDOWN USING marked.js */

const parsed = marked.parse(data.reply)

chat.innerHTML+=`
<div class="msg ai">
${parsed}
</div>
`

chat.scrollTop=chat.scrollHeight

}

</script>

</body>
</html>
